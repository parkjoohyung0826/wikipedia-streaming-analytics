name: Week 4 pipeline verification
on:
  push:
    paths:
      - 'src/process_edits.py'
      - 'src/stream_edits.py'
      - 'compose.week4.yml'
      - 'docker/**'
      - 'sql/**'
      - 'scripts/**'
      - 'tests/**'
      - 'src/producer.py'
      - 'samples/**'
      - 'docker-compose.yml'
      - 'requirements.txt'
      - '.github/workflows/week4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test transforms, crash recovery, replay and Parquet
        run: python scripts/week4.py verify
      - name: Process real collected sample and compare source records
        run: python scripts/week4.py demo
      - name: Stateful streaming verification
        run: python scripts/week4.py verify-stream
      - name: Existing collector and producer regression tests
        run: docker compose -f docker-compose.yml -f compose.week4.yml run --rm -T producer -m unittest discover -s tests/unit -v
      - name: Upload verification evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-verification
          path: |
            evidence/week4/
            artifacts/week4/tests/**/*.log
            artifacts/week4/tests/**/*.json
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.week4.yml logs --tail 100

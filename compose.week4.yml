services:
  producer:
    build:
      context: .
      dockerfile: docker/producer.Dockerfile
    profiles: ["week4"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      - .:/workspace
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["python"]
    command: ["-m", "src.producer", "--bootstrap-servers", "kafka:29092", "--input", "samples/wikipedia_edits.jsonl", "--rate", "10"]
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: wiki
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:-wiki_local_lab}
    volumes:
      - week4-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 20
  spark:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    profiles: ["week4"]
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: wiki
      PGUSER: wiki
      PGPASSWORD: ${WIKI_DB_PASSWORD:-wiki_local_lab}
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_DRIVER_BIND_ADDRESS: 127.0.0.1
    volumes:
      - .:/workspace
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint:
      - /opt/entrypoint.sh
      - driver
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/tmp/week4-ivy
    command: ["src/process_edits.py"]
volumes:
  week4-postgres:

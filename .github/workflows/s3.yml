name: S3 batch unit tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/unit -v

  spark-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/spark.Dockerfile -t wiki-spark-test .
      - name: Validate date partitions, replay and publication without AWS
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          -e PYTHONPATH=/workspace -e SPARK_LOCAL_IP=127.0.0.1
          --entrypoint /opt/entrypoint.sh wiki-spark-test
          driver --master 'local[2]' --driver-memory 1g
          --conf spark.jars.ivy=/tmp/test-ivy tests/integration/test_spark_s3.py
